<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý cửa hàng Nguyên Ninh</title><script src="https://cdn.tailwindcss.com/3.4.17"></script><style>body{background:#FFFCF5;color:#332D26}input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px}label{display:block;margin-top:12px}button{min-height:44px;padding:8px 16px;border:1px solid #426B38;border-radius:8px}button:disabled{opacity:.5}input[type=checkbox]{width:auto}dialog::backdrop{background:#0008}</style></head><body><main class="mx-auto max-w-6xl p-5"><header class="flex flex-wrap items-center justify-between gap-4"><h1 class="font-serif text-3xl text-green-800">Quản lý cửa hàng</h1><a href="index.html">Xem website ↗</a></header><p id="admin-status" role="status" aria-live="polite" class="my-4 text-red-800"></p><form id="login" class="mx-auto mt-10 max-w-sm rounded-xl border p-5"><h2 class="text-xl font-bold">Đăng nhập quản trị</h2><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required><button id="login-button" class="mt-5 w-full bg-green-800 text-white">Đăng nhập</button></form><div id="dashboard" hidden><div class="my-5 flex gap-3"><button id="reload">Tải lại dữ liệu</button><button id="logout">Đăng xuất</button></div><section><h2 class="font-serif text-2xl text-green-800">Kho sản phẩm</h2><button id="new-product" class="mt-4 bg-green-800 text-white">+ Thêm sản phẩm</button><label for="search">Tìm sản phẩm</label><input id="search" type="search" placeholder="Tên sản phẩm…"><div id="product-list" class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div></section><section class="mt-12"><h2 class="font-serif text-2xl text-green-800">Đơn hàng</h2><label for="order-filter">Lọc trạng thái</label><select id="order-filter"><option value="all">Tất cả</option><option value="new">Mới</option><option value="confirmed">Đã xác nhận</option><option value="shipping">Đang giao</option><option value="done">Hoàn thành</option><option value="cancelled">Đã hủy</option></select><div id="order-list" class="mt-5 space-y-4"></div><button id="more-orders" class="mt-4" hidden>Xem thêm đơn</button></section></div></main><dialog id="editor" class="w-[calc(100%_-_2rem)] max-w-xl rounded-xl p-5"><div class="flex justify-between"><h2 class="text-xl font-bold">Sản phẩm</h2><button id="editor-close" aria-label="Đóng">×</button></div><form id="product-form"><input name="id" type="hidden"><label>Tên sản phẩm<input name="name" required maxlength="200"></label><div class="grid grid-cols-2 gap-3"><label>Giá (đ)<input name="price" type="number" min="0" max="100000000" step="1" required></label><label>Tồn kho<input name="stock" type="number" min="0" max="1000000" step="1" required></label></div><label>Quy cách<input name="unit" maxlength="200" placeholder="Hộp 10 bánh"></label><label>Mô tả<textarea name="description" rows="3"></textarea></label><label>Thành phần<textarea name="ingredients" rows="2"></textarea></label><label>Hạn dùng / bảo quản<textarea name="shelf_life" rows="2"></textarea></label><label>Đường dẫn ảnh (mỗi dòng một ảnh)<textarea name="images" rows="3" placeholder="images/banh-com.jpg hoặc https://..."></textarea></label><label><input name="active" type="checkbox"> Đang bán</label><label><input name="hot" type="checkbox"> Sản phẩm nổi bật</label><button id="product-save" class="mt-5 w-full bg-green-800 text-white">Lưu sản phẩm</button><p id="editor-status" role="status" class="mt-3 text-red-800"></p></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
